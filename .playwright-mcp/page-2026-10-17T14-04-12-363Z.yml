              - generic [ref=f48e276]:
                - paragraph [ref=f48e277]: Agradecemos por ajudar a manter o Google Play um espaço seguro e confiável para os usuários.
                - paragraph [ref=f48e278]: Neste questionário, vamos pedir informações sobre os dados do usuário coletados ou compartilhados pelo app. Essas informações vão aparecer na página "Detalhes do app" para ajudar os usuários a entender a privacidade, a segurança e as práticas de tratamento de dados do app antes de fazerem o download dele.
                - paragraph [ref=f48e279]: Antes de começar, leia as informações a seguir sobre as perguntas que serão feitas e as respostas que você precisará fornecer. As informações fornecidas serão revisadas pelo Google como parte do processo de revisão do app.
              - generic [ref=f48e281]:
                - heading "Definições" [level=2] [ref=f48e290]
                - generic [ref=f48e291]:
                  - paragraph [ref=f48e292]:
                    - text: Na próxima tela, perguntaremos se o app coleta ou compartilha qualquer tipo de dados do usuário obrigatórios.
                    - link "Ver tipos de dados obrigatórios, Abre em uma nova guia" [ref=f48e294] [cursor=pointer]:
                      - /url: https://support.google.com/googleplay/android-developer/answer/10787469?hl=pt-BR#types
                      - text: Ver tipos de dados obrigatórios
                  - paragraph [ref=f48e295]:
                    - text: "\"Coletados\" significa dados que foram transmitidos para fora do dispositivo do usuário, para você ou para terceiros. Alguns tipos de coleta de dados são isentos."
                    - link "Ver isenções, Abre em uma nova guia" [ref=f48e297] [cursor=pointer]:
                      - /url: https://support.google.com/googleplay/android-developer/answer/10787469?hl=pt-BR#types
                      - text: Ver isenções
                  - paragraph [ref=f48e298]:
                    - text: Processamento "efêmero" de dados significa acessar e usar esses dados enquanto eles estão armazenados apenas na memória e não são mantidos por mais tempo do que o necessário para atender à solicitação específica em tempo real. Você também precisa avisar quando os dados são coletados assim, mas essa informação não será exibida aos usuários na página "Detalhes do app".
                    - link "Saiba mais sobre dados processados de maneira efêmera, Abre em uma nova guia" [ref=f48e300] [cursor=pointer]:
                      - /url: https://support.google.com/googleplay/android-developer/answer/10787469?hl=pt-BR#collection
                      - text: Saiba mais
                  - paragraph [ref=f48e301]:
                    - text: "\"Compartilhados\" significa dados que são transferidos a terceiros, tanto no próprio dispositivo do usuário quanto para fora dele. Alguns tipos de transferências de dados são isentos."
                    - link "Ver isenções, Abre em uma nova guia" [ref=f48e303] [cursor=pointer]:
                      - /url: https://support.google.com/googleplay/android-developer/answer/10787469?hl=pt-BR#sharing
                      - text: Ver isenções
