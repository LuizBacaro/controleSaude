                            - textbox "Descrição completa" [ref=f76e476]: "O ExameFácil organiza os laudos de exames laboratoriais que você importa em PDF. No app dá para: - conferir o laudo antes de salvar e escolher quais resultados entram; - ver o painel da última coleta, com o que merece atenção e o que mudou desde a coleta anterior; - acompanhar a evolução de cada marcador; - guardar o histórico com laboratório, data da coleta, médico e convênio; - usar sexo e idade para escolher a faixa de referência quando o laudo traz faixas diferentes. O médico que você convidar só lê a evolução depois de aceitar o convite. Você pode revogar esse acesso. As faixas e os avisos são informativos. O ExameFácil não diagnostica, não prescreve e não substitui o médico nem o laboratório. O acesso é com e-mail e senha. Cada conta vê os próprios laudos. Política de privacidade: https://docs.google.com/document/d/e/2PACX-1vT-wXLR6zwfUiRpRaM8FNtiJHTrqKxoiTMBvCzKKxHeHADjU9Mb3NI5ilFUsKe2FgiVBIPDUFfOqT7A/pub"
