name: exame_facil
description: "ExameFácil — acompanhe a evolução dos seus exames de sangue."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  intl: ^0.20.2
  file_picker: ^10.3.3
  syncfusion_flutter_pdf: ^31.1.19
  fl_chart: ^1.1.1
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  uuid: ^4.5.1
  path: ^1.9.1
  supabase_flutter: ^2.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png
    - assets/brand/app_icon.png
